        h2 {
            margin-bottom: 20px;
        }

            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }

            background-color: #45a049;
